[workspace]
members = ["crates/gateway-core", "crates/gateway-cli", "crates/gateway-app"]
resolver = "2"

# 依赖版本集中在这里，成员一律 `workspace = true`，避免三个 crate 版本漂移。
[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
bytes = "1"
futures-core = "0.3"

# profile 只能写在 workspace 根，成员里写了会被忽略。
[profile.release]
strip = true
lto = "thin"
